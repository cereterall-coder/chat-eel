<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-ELL | Intranet</title>
    <!-- Font for Elegance -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&family=League+Gothic&family=Caveat:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-elegant {
            font-family: 'Cinzel', serif;
        }

        .font-logo {
            font-family: 'League Gothic', sans-serif;
            letter-spacing: 0.05em;
        }

        .font-hand {
            font-family: 'Caveat', cursive;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .chat-bg {
            background-color: #e5ddd5;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            opacity: 0.1;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen overflow-hidden font-sans">

    <!-- Login Modal -->
    <div id="login-screen"
        class="fixed inset-0 bg-gradient-to-br from-green-900 via-emerald-900 to-black z-50 flex items-center justify-center transition-opacity">

        <!-- Decoration Circles -->
        <div
            class="absolute top-20 left-20 w-72 h-72 bg-green-500 rounded-full mix-blend-multiply filter blur-2xl opacity-10 animate-blob">
        </div>
        <div
            class="absolute bottom-20 right-20 w-72 h-72 bg-emerald-500 rounded-full mix-blend-multiply filter blur-2xl opacity-10 animate-blob animation-delay-2000">
        </div>

        <div
            class="bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] w-96 text-center transform scale-100 transition-transform border border-white/20 relative z-10">

            <img src="/logo.png" alt="Chat-EEL Logo"
                class="w-24 h-24 mx-auto mb-3 object-contain drop-shadow-xl hover:scale-105 transition-transform duration-300">

            <h2 class="text-5xl text-gray-800 mb-0 font-logo tracking-wide drop-shadow-sm leading-none">Chat-EEL</h2>
            <p class="text-gray-500 text-[10px] uppercase tracking-widest mb-5 font-semibold">Mensajería Intranet
                Exclusiva
            </p>

            <div class="space-y-3">
                <div class="relative group">
                    <input type="text" id="username-input"
                        class="w-full bg-gray-50 border-2 border-gray-100 p-2 pl-4 rounded-xl shadow-md focus:outline-none focus:border-green-600 focus:bg-white transition-all text-gray-700 font-medium placeholder-gray-400 text-sm"
                        placeholder="Nombre de Usuario..." maxlength="15" autocomplete="off">
                </div>

                <div class="relative group">
                    <input type="password" id="password-input"
                        class="w-full bg-gray-50 border-2 border-gray-100 p-2 pl-4 pr-10 rounded-xl shadow-md focus:outline-none focus:border-green-600 focus:bg-white transition-all text-gray-700 font-medium placeholder-gray-400 text-sm"
                        placeholder="Contraseña de Acceso" maxlength="20">
                    <button type="button" onclick="togglePasswordVisibility()"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-green-700 transition focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" id="eye-icon">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="login-error"
                class="hidden text-red-500 text-[10px] mt-2 font-bold bg-red-50 p-1 rounded border border-red-100">
            </div>

            <button onclick="joinChat()"
                class="w-full mt-5 bg-gradient-to-r from-green-700 to-green-900 text-white p-2 rounded-xl hover:from-green-600 hover:to-green-800 transition-all shadow-lg hover:shadow-green-500/30 active:scale-95 transform font-logo text-xl tracking-wider pt-3 pb-2">
                INGRESAR
            </button>

            <div class="mt-5 pt-3 border-t border-gray-50">
                <div class="text-sm text-green-800 font-bold tracking-wide font-hand leading-none whitespace-nowrap">
                    Copy right: Ing. A. Alexis V. Vargas - Tfno: 944499069</div>
                <div
                    class="text-sm text-green-800 font-bold tracking-wide font-hand mt-1 leading-none whitespace-nowrap">
                    Colaboración:
                    Blanca La Rosa Avalos</div>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden h-full max-w-[1700px] mx-auto shadow-2xl relative bg-white overflow-hidden">

        <!-- Sidebar (User List) -->
        <div class="w-full md:w-80 lg:w-96 border-r border-gray-200 flex flex-col h-full bg-white z-20">
            <!-- Header sidebar -->
            <div class="bg-green-800 p-4 flex items-center justify-between h-16 shadow-md z-10">
                <div class="flex items-center gap-3">
                    <img src="/logo.png" alt="Logo" class="w-10 h-10 object-contain bg-white rounded-full p-1">
                    <div>
                        <span class="text-white text-2xl block leading-tight font-logo tracking-wide">Chat-EEL</span>
                    </div>
                </div>
            </div>

            <!-- User List -->
            <div class="flex-1 overflow-y-auto p-2">
                <div
                    class="px-4 py-3 text-xs font-bold text-green-800 uppercase tracking-widest bg-gray-50 rounded mb-2 border-b border-gray-100">
                    Usuarios Activos
                </div>
                <ul id="user-list" class="space-y-1">
                    <!-- Populated by JS -->
                </ul>
            </div>

            <div class="p-3 bg-gray-50 text-[10px] text-center text-gray-400 border-t uppercase tracking-widest">
                Intranet Segura
            </div>
        </div>

        <!-- Chat Area -->
        <div class="hidden md:flex flex-1 flex-col bg-[#efeae2] relative h-full">
            <!-- Background Pattern -->
            <div class="absolute inset-0 chat-bg pointer-events-none"></div>

            <!-- Chat Header -->
            <div
                class="bg-gray-100 p-3 border-b border-gray-200 h-16 flex items-center shadow-sm z-10 w-full justify-between px-6">
                <!-- Left: Active Chat Name -->
                <div class="flex flex-col">
                    <span id="chat-title" class="font-bold text-gray-800 text-lg">Sala General</span>
                    <span id="typing-indicator"
                        class="text-xs text-green-600 font-medium italic h-4 transition-all opacity-0 transform translate-y-1">
                        Alguien escribe...
                    </span>
                </div>

                <!-- Right: My Info & Logout -->
                <div class="flex items-center gap-4">
                    <div class="text-right hidden md:block">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider">Conectado como</div>
                        <div id="my-name-display" class="font-bold text-green-800 text-sm font-elegant">Usuario</div>
                    </div>
                    <div class="h-8 w-px bg-gray-300 mx-1"></div>
                    <button onclick="logout()"
                        class="text-red-500 hover:text-red-700 transition p-2 hover:bg-red-50 rounded-full"
                        title="Cerrar Sesión">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messages" class="flex-1 overflow-y-auto p-4 md:p-10 space-y-3 z-10 scroll-smooth">
                <!-- Messages Populated by JS -->
            </div>

            <!-- Input Area -->
            <div class="bg-gray-100 p-4 z-10 border-t border-gray-200">
                <form onsubmit="sendMessage(event)" class="flex gap-3 max-w-4xl mx-auto relative">
                    <!-- Emoji Button -->
                    <button type="button" onclick="toggleEmojiPicker()"
                        class="text-gray-400 hover:text-yellow-500 transition p-2 rounded-full hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>

                    <!-- Emoji Picker (Hidden) -->
                    <div id="emoji-picker"
                        class="hidden absolute bottom-16 left-0 bg-white shadow-xl rounded-lg p-2 grid grid-cols-6 gap-2 border border-gray-200 w-64 h-48 overflow-y-auto z-50">
                        <!-- Populated by JS -->
                    </div>

                    <input id="msg-input" type="text"
                        class="flex-1 p-3 rounded-lg border border-gray-300 focus:outline-none focus:border-green-800 focus:ring-1 focus:ring-green-800 shadow-sm"
                        placeholder="Escribe un mensaje..." autocomplete="off">

                    <button type="submit"
                        class="bg-green-800 text-white p-3 px-5 rounded-lg hover:bg-green-900 transition shadow-md flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast"
        class="fixed top-5 right-5 bg-gray-800 text-white px-6 py-4 rounded-lg shadow-2xl transform translate-x-[150%] transition-transform duration-500 z-50 flex items-center gap-3 border-l-4 border-green-500">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span id="toast-msg">Notificación</span>
    </div>

    <!-- Client Logic -->
    <script>
        const socket = io();
        let myUsername = '';
        let myId = '';
        let activeChat = 'general'; // 'general' or socketId
        let chats = {
            'general': { name: 'Sala General', messages: [], unread: 0 }
        };
        let typingTimeout;

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const userList = document.getElementById('user-list');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const typingIndicator = document.getElementById('typing-indicator');

        // Allow 'Enter' to join
        document.getElementById('username-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') joinChat();
        });
        document.getElementById('password-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') joinChat();
        });

        function joinChat() {
            const nameInput = document.getElementById('username-input');
            const passInput = document.getElementById('password-input');
            const errDiv = document.getElementById('login-error');

            const name = nameInput.value.trim();
            const password = passInput.value.trim();

            if (!name) {
                errDiv.textContent = 'El nombre es obligatorio';
                errDiv.classList.remove('hidden');
                return;
            }
            if (!password) {
                errDiv.textContent = 'La contraseña es obligatoria para proteger tu chat';
                errDiv.classList.remove('hidden');
                return;
            }

            errDiv.classList.add('hidden');
            socket.emit('join', { username: name, password: password });
        }

        socket.on('login_error', (msg) => {
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');

            // Shake effect
            const box = loginScreen.querySelector('.bg-white');
            if (box) {
                box.classList.add('animate-pulse');
                setTimeout(() => box.classList.remove('animate-pulse'), 500);
            }
        });



        function selectChat(id, name) {
            activeChat = id;

            // Initialize if not exists
            if (!chats[id]) {
                chats[id] = { name: name, messages: [], unread: 0 };
            }

            // Reset unread
            chats[id].unread = 0;
            updateUserListUI(); // To clear unread badge

            // Update Header
            const title = id === 'general' ? 'Sala General' : `Chat con ${chats[id].name}`;
            document.getElementById('chat-title').textContent = title;

            // Render Messages
            renderMessages(chats[id].messages);
        }

        function renderMessages(msgs) {
            messagesDiv.innerHTML = '';
            msgs.forEach(msg => appendMessageUI(msg));
            scrollToBottom();
        }

        // --- Socket Events ---

        socket.on('connect', () => {
            myId = socket.id;
        });

        let lastUsers = [];
        socket.on('user_list', (users) => { lastUsers = users; updateUserListUI(); });

        socket.on('login_success', (data) => {
            myUsername = data.name;
            // Update UI my name
            document.getElementById('my-name-display').textContent = myUsername;

            // UI Transition
            loginScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                loginScreen.style.display = 'none';
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
            }, 300);
        });



        function updateUserListUI() {
            // Logic duplicated from above, using lastUsers
            if (!lastUsers) return;

            const listHtml = lastUsers.filter(u => u.id !== socket.id).map(u => {
                const unreadCount = chats[u.id]?.unread || 0;
                const isSelected = activeChat === u.id;

                return `
                <li onclick="selectChat('${u.id}', '${u.name}')" 
                    title="IP: ${u.ip || 'Desconocida'}"
                    class="flex items-center gap-3 p-3 rounded-lg cursor-pointer transition group border-l-4 
                    ${isSelected ? 'bg-gray-100 border-green-800' : 'hover:bg-gray-50 border-transparent'}">
                    
                    <div class="relative">
                        <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold overflow-hidden shadow-sm">
                            <img src="https://ui-avatars.com/api/?name=${u.name}&background=25D366&color=fff&bold=true" alt="${u.name}">
                        </div>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center">
                            <div class="font-medium text-gray-800 truncate">${u.name}</div>
                            ${unreadCount > 0 ?
                        `<div class="bg-green-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm animate-pulse">${unreadCount}</div>`
                        : ''}
                        </div>
                        <div class="text-[10px] text-gray-400 truncate">En línea</div>
                    </div>
                </li>
                `;
            }).join('');

            const generalUnread = chats['general'].unread || 0;
            const generalSelected = activeChat === 'general';
            const generalItem = `
                <li onclick="selectChat('general', 'Sala General')" 
                    class="flex items-center gap-3 p-3 rounded-lg cursor-pointer transition group border-l-4 mb-2
                    ${generalSelected ? 'bg-gray-100 border-green-500' : 'hover:bg-gray-50 border-transparent'}">
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold shadow-sm">
                        #
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <div class="font-medium text-gray-800">Sala General</div>
                            ${generalUnread > 0 ?
                    `<div class="bg-green-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${generalUnread}</div>` : ''}
                        </div>
                        <div class="text-[10px] text-gray-400">Broadcast</div>
                    </div>
                </li>
            `;
            userList.innerHTML = generalItem + listHtml;
        }


        socket.on('history', (history) => {
            // Only for general room
            chats['general'].messages = history;
            if (activeChat === 'general') renderMessages(history);
        });

        // General Messages
        socket.on('message', (msg) => {
            if (msg.system) {
                showToast(msg.text);
            } else {
                handleIncomingMessage('general', msg);
            }
        });

        // Private Messages
        socket.on('private_message', (msg) => {
            // Identify conversation partner
            // If I sent it, partner is targetId. If I received it, partner is senderId.
            const partnerId = msg.senderId === socket.id ? msg.targetId : msg.senderId;

            // Ensure chat exists
            if (!chats[partnerId]) {
                const partnerName = lastUsers.find(u => u.id === partnerId)?.name || msg.sender;
                chats[partnerId] = { name: partnerName, messages: [], unread: 0 };
            }

            handleIncomingMessage(partnerId, msg);
        });

        function handleIncomingMessage(chatId, msg) {
            chats[chatId].messages.push(msg);

            if (activeChat === chatId) {
                appendMessageUI(msg);
                scrollToBottom();
            } else {
                chats[chatId].unread++;
                updateUserListUI();
                if (chatId !== 'general') showToast(`Mensaje de ${chats[chatId].name}`);
            }
        }

        socket.on('typing', (data) => {
            // Robust check
            const name = data.user || data;
            const isPrivate = data.isPrivate;
            const senderId = data.senderId;

            let shouldShow = false;
            if (isPrivate) {
                if (activeChat === senderId) shouldShow = true;
            } else {
                if (activeChat === 'general' && !isPrivate) shouldShow = true;
            }

            if (shouldShow) {
                typingIndicator.textContent = `${name} está escribiendo...`;
                typingIndicator.classList.remove('opacity-0', 'translate-y-1');

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    typingIndicator.classList.add('opacity-0', 'translate-y-1');
                }, 2000); // Hide after 2s of inactivity
            }
        });

        socket.on('disconnect', () => {
            showToast('Desconectado del servidor', true);
        });

        // --- Functions ---

        function sendMessage(e) {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text) return;

            if (activeChat === 'general') {
                socket.emit('chat_message', text);
            } else {
                socket.emit('private_message', { targetId: activeChat, text: text });
            }

            msgInput.value = '';
        }

        msgInput.addEventListener('input', () => {
            // Typing logic...
            socket.emit('typing', activeChat === 'general' ? null : activeChat);
        });

        function appendMessageUI(msg) {
            // Determine if message is mine
            // Check both senderId (best) or name
            const isMe = msg.senderId === socket.id || msg.sender === myUsername;

            const div = document.createElement('div');
            div.className = `flex mb-2 ${isMe ? 'justify-end' : 'justify-start'} w-full`;

            const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            div.innerHTML = `
                <div class="max-w-[75%] md:max-w-[60%] rounded-lg px-4 py-2 shadow-sm relative text-sm 
                            ${isMe ? 'bg-[#d9fdd3] rounded-tr-none text-gray-900' : 'bg-white rounded-tl-none text-gray-900'}">
                    ${!isMe && activeChat === 'general' ? `<div class="text-xs font-bold text-green-700 mb-1 opacity-90">${msg.sender}</div>` : ''}
                    <div class="pb-[14px] leading-relaxed break-words">${msg.text}</div>
                    <div class="absolute bottom-1 right-2 text-[10px] text-gray-500 leading-none select-none flex items-center gap-1">
                       <span>${time}</span>
                       ${isMe ? '<span class="text-blue-500">✓✓</span>' : ''} 
                    </div>
                </div>
            `;
            messagesDiv.appendChild(div);
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showToast(text, error = false) {
            const toast = document.getElementById('toast');
            toast.classList.remove(error ? 'border-green-500' : 'border-red-500');
            toast.classList.add(error ? 'border-red-500' : 'border-green-500');

            document.getElementById('toast-msg').textContent = text;
            toast.classList.remove('translate-x-[150%]');

            setTimeout(() => {
                toast.classList.add('translate-x-[150%]');
            }, 4000);
        }

        function logout() {
            socket.disconnect();
            myUsername = '';
            document.getElementById('username-input').value = '';
            document.getElementById('password-input').value = '';
            chats = { 'general': { name: 'Sala General', messages: [], unread: 0 } };
            activeChat = 'general';

            appContainer.classList.add('hidden');
            appContainer.classList.remove('flex');
            loginScreen.style.display = 'flex';

            setTimeout(() => {
                loginScreen.classList.remove('opacity-0', 'pointer-events-none');
            }, 50);

            socket.connect();
        }

        // --- Emoji Logic ---
        const emojis = [
            '😀', '😃', '😄', '😁', '😆', '😅', '😂', '🤣', '😊', '😇', '🙂', '🙃', '😉', '😌', '😍', '🥰', '😘', '😗', '😙', '😚',
            '😋', '😛', '😝', '😜', '🤪', '🤨', '🧐', '🤓', '😎', '🤩', '🥳', '😏', '😒', '😞', '😔', '😟', '😕', '🙁', '☹️', '😣',
            '😖', '😫', '😩', '🥺', '😢', '😭', '😤', '😠', '😡', '🤬', '🤯', '😳', '🥵', '🥶', '😱', '😨', '😰', '😥', '😓', '🤗',
            '🤔', '🤭', '🤫', '🤥', '😶', '😐', '😑', '😬', '🙄', '😯', '😦', '😧', '😮', '😲', '🥱', '😴', '🤤', '😪', '😵', '🤐',
            '🥴', '🤢', '🤮', '🤧', '😷', '🤒', '🤕', '🤑', '🤠', '😈', '👿', '👹', '👺', '🤡', '💩', '👻', '💀', '☠️', '👽', '👾',
            '🤖', '🎃', '😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾', '👋', '🤚', '🖐', '✋', '🖖', '👌', '🤏', '✌️', '🤞',
            '🤟', '🤘', '🤙', '👈', '👉', '👆', '🖕', '👇', '👍', '👎', '✊', '👊', '🤛', '🤜', '👏', '🙌', '👐', '🤲', '🤝', '🙏'
        ];

        const emojiPicker = document.getElementById('emoji-picker');

        // Populate
        emojis.forEach(emoji => {
            const btn = document.createElement('button');
            btn.className = 'text-xl hover:bg-gray-100 p-1 rounded transition';
            btn.textContent = emoji;
            btn.type = 'button';
            btn.onclick = () => {
                msgInput.value += emoji;
                msgInput.focus();
                toggleEmojiPicker(); // Optional: Close on pick? Let's keep open if user wants multiple
            };
            emojiPicker.appendChild(btn);
        });

        function toggleEmojiPicker() {
            emojiPicker.classList.toggle('hidden');
        }

        // Close picker if clicking outside
        document.addEventListener('click', (e) => {
            const btn = document.querySelector('button[onclick="toggleEmojiPicker()"]');
            if (!emojiPicker.contains(e.target) && !btn.contains(e.target) && !emojiPicker.classList.contains('hidden')) {
                emojiPicker.classList.add('hidden');
            }
        });

        function togglePasswordVisibility() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                // Switch to Eye Slash (or just color change, here SVG swap is best but keeping simple first)
                icon.firstElementChild.setAttribute('d', 'M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21');
                icon.lastElementChild.setAttribute('d', ''); // Clear second path if complex, or just swap full innerHTML

                // Simpler: Just swap innerHTML for clean Eye Slash
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;

            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        }
