<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-ELL | Supervisor</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <!-- Font for Elegance -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&family=League+Gothic&family=Caveat:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-elegant {
            font-family: 'Cinzel', serif;
        }

        .font-logo {
            font-family: 'League Gothic', sans-serif;
            letter-spacing: 0.05em;
        }

        .font-hand {
            font-family: 'Caveat', cursive;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .chat-bg {
            background-color: #e5ddd5;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            opacity: 0.1;
        }

        /* Hide default browser password eye */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

        /* Persistent Super Alert */
        #super-alert {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-left: 6px solid #ef4444;
            /* Red border */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: start;
            gap: 15px;
            max-width: 350px;
        }

        #super-alert.show {
            transform: translateX(0);
        }

        .super-alert-close {
            position: absolute;
            top: 5px;
            right: 8px;
            cursor: pointer;
            color: #999;
            font-size: 18px;
        }

        .super-alert-close:hover {
            color: #333;
        }
    </style>
</head>

    <!-- Client Logic -->
    <script>
        const socket = io();
        let myUsername = '';
        let myId = '';
        let activeChat = 'general'; // 'general' or socketId
        let chats = {
            'general': { name: 'Sala General', messages: [], unread: 0 }
        };
        let typingTimeout;

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const userList = document.getElementById('user-list');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const typingIndicator = document.getElementById('typing-indicator');

        // Allow 'Enter' to join
        document.getElementById('username-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') joinChat();
        });
        document.getElementById('password-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') joinChat();
        });

        function joinChat() {
            const nameInput = document.getElementById('username-input');
            const passInput = document.getElementById('password-input');
            const errDiv = document.getElementById('login-error');

            const name = nameInput.value.trim();
            const password = passInput.value.trim();

            // Request Notification Permission on first interaction (Login Click)
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }

            if (!name) {
                errDiv.textContent = 'El nombre es obligatorio';
                errDiv.classList.remove('hidden');
                return;
            }
            if (!password) {
                errDiv.textContent = 'La contraseña es obligatoria para proteger tu chat';
                errDiv.classList.remove('hidden');
                return;
            }

            errDiv.classList.add('hidden');
            socket.emit('join', { username: name, password: password });
        }

        socket.on('login_error', (msg) => {
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');

            // Shake effect
            const box = loginScreen.querySelector('.bg-white');
            if (box) {
                box.classList.add('animate-pulse');
                setTimeout(() => box.classList.remove('animate-pulse'), 500);
            }
        });



        function selectChat(id, name) {
            activeChat = id;

            // Initialize if not exists
            if (!chats[id]) {
                chats[id] = { name: name, messages: [], unread: 0 };
            }

            // Reset unread
            chats[id].unread = 0;
            updateUserListUI(); // To clear unread badge

            // Update Header
            const title = id === 'general' ? 'Sala General' : `Chat con ${chats[id].name}`;
            document.getElementById('chat-title').textContent = title;

            // Render Messages
            renderMessages(chats[id].messages);
        }

        function renderMessages(msgs) {
            messagesDiv.innerHTML = '';
            msgs.forEach(msg => appendMessageUI(msg));
            scrollToBottom();
        }

        // --- Socket Events ---

        socket.on('connect', () => {
            myId = socket.id;
        });

        let lastUsers = [];
        socket.on('user_list', (users) => { lastUsers = users; updateUserListUI(); });

        socket.on('login_success', (data) => {
            myUsername = data.name;
            // Update UI my name
            document.getElementById('my-name-display').textContent = myUsername;

            // UI Transition
            loginScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                loginScreen.style.display = 'none';
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
            }, 300);
        });


        let hideInactive = false; // Filter state

        function toggleUserFilter() {
            hideInactive = !hideInactive;
            const btn = document.getElementById('filter-btn');
            if (hideInactive) {
                btn.classList.add('bg-green-500', 'text-white');
                btn.classList.remove('bg-gray-100', 'text-gray-400');
            } else {
                btn.classList.remove('bg-green-500', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-400');
            }
            updateUserListUI();
        }

        let favorites = JSON.parse(localStorage.getItem('chat_favorites') || '[]');

        function toggleFavorite(id, event) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(fid => fid !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('chat_favorites', JSON.stringify(favorites));
            updateUserListUI();
        }

        function updateUserListUI() {
            const userList = document.getElementById('user-list');
            const searchTerm = (document.getElementById('search-users')?.value || '').toLowerCase();

            // Filter out myself
            let users = [...lastUsers].filter(u => u.id !== socket.id);

            // Add chats that are not in the online user list (e.g. Hidden Support, Disconnected Users)
            Object.keys(chats).forEach(chatId => {
                if (chatId !== 'general' && !users.find(u => u.id === chatId)) {
                    // Create a fake user object for the UI
                    users.push({
                        id: chatId,
                        name: chats[chatId].name,
                        ip: 'Privado/Desconectado',
                        isVirtual: true // Marker
                    });
                }
            });

            // 1. Text Search Filtering
            if (searchTerm) {
                users = users.filter(u =>
                    u.name.toLowerCase().includes(searchTerm) ||
                    (u.ip || '').includes(searchTerm)
                );
            } else if (hideInactive) {
                // 2. Hide Inactive (if no search term)
                // Keep if: Favorite OR Has Messages OR Has Unread OR Is Active Chat
                users = users.filter(u => {
                    const isFav = favorites.includes(u.id);
                    const hasMsgs = chats[u.id] && chats[u.id].messages.length > 0;
                    const hasUnread = chats[u.id] && chats[u.id].unread > 0;
                    const isActive = activeChat === u.id;
                    return isFav || hasMsgs || hasUnread || isActive;
                });
            }

            // Sorting: Favorites > Active Chats (Unread/History) > Alphabetical
            users.sort((a, b) => {
                const aFav = favorites.includes(a.id);

            // Top: Newest

            msgs.forEach(msg => {
                // Re-use logic w/o triggering 'prepend' again if we just append?

                // Simpler: Just modify appendMessageUI to ALWAYS prepend (add to top).
                // Then for history [New, Old], we iterate REVERSE ([Old, New])? 
                // No.
                // Goal:
                // NEW

                // If I have New, I prepend it -> [New]
                // Then I have Old, I prepend it -> [Old, New] -> Top is Old. WRONG.

                // So if I prepend, I need to process OLDEST first.
                // Server sends [Newest ... Oldest].
                // So I should reverse user list to [Oldest ... Newest] and then Prepend each?
                // [Old] -> [Old]
                // [New] -> [New, Old] -> Top is New. CORRECT.
                // So we need to reverse the history array received from server (which was reversed there).
                // Server: sends [Newest...Oldest].
                // Client: receives [Newest...Oldest].
                // Reverse it -> [Oldest...Newest].
                // Loop:
                // 1. Oldest -> Prepend -> [Oldest]
                // 2. Newer  -> Prepend -> [Newer, Oldest]
                // Result: Newer at top. Correct.

                appendMessageUI(msg);

            // Old

        }
