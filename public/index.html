<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-ELL | Conectados en Intranet</title>
    <link rel="icon" type="image/png" href="/logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Gothic&family=Cinzel:wght@700&display=swap"
        rel="stylesheet">

    <!-- Custom Style -->
    <link rel="stylesheet" href="/style.css">

    <!-- Socket IO -->
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

    <!-- Auth Screen -->
    <div id="login-screen">
        <div id="auth-box">
            <img src="/logo.png" alt="Logo" class="auth-logo">
            <h1 class="auth-title">CHAT-ELL</h1>

            <div id="view-login" class="space-y-4">
                <div class="input-group">
                    <input type="text" id="login-user" placeholder="Escribe tu usuario"
                        onkeydown="if(event.key==='Enter') handleLogin()">
                </div>
                <div class="input-group">
                    <div class="password-wrapper">
                        <input type="password" id="login-pass" placeholder="Escribe tu contraseña"
                            onkeydown="if(event.key==='Enter') handleLogin()">
                        <div class="toggle-password" onclick="togglePassword('login-pass')">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>
                <button onclick="handleLogin()" class="btn btn-primary">Iniciar Sesión</button>
                <button onclick="showView('register')" class="btn btn-link">¿Eres nuevo? Regístrate aquí</button>
            </div>

            <div id="view-register" class="hidden">
                <div class="input-group"><input type="text" id="reg-user" placeholder="Usuario deseado"
                        onkeydown="if(event.key==='Enter') handleRegister()"></div>
                <div class="input-group"><input type="text" id="reg-name" placeholder="Nombre completo"
                        onkeydown="if(event.key==='Enter') handleRegister()"></div>
                <div class="input-group"><input type="text" id="reg-phone" placeholder="WhatsApp (Ej: 999 888 777)"
                        onkeydown="if(event.key==='Enter') handleRegister()">
                </div>
                <div class="input-group"><input type="text" id="reg-office" placeholder="Oficina o Servicio"
                        onkeydown="if(event.key==='Enter') handleRegister()"></div>
                <button onclick="handleRegister()" class="btn btn-primary">Solicitar Acceso</button>
                <button onclick="showView('login')" class="btn btn-link">Ya tengo cuenta, volver</button>
            </div>

            <div id="view-activate" class="hidden">
                <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Introduce el código y tu nueva contraseña.
                </p>
                <div class="input-group"><input type="text" id="act-user" placeholder="Usuario" readonly></div>
                <div class="input-group"><input type="text" id="act-code" placeholder="Código de 6 dígitos"
                        onkeydown="if(event.key==='Enter') handleActivate()"
                        style="text-align: center; letter-spacing: 4px; font-weight: bold;"></div>
                <div class="input-group">
                    <div class="password-wrapper">
                        <input type="password" id="act-pass" placeholder="Crea tu contraseña"
                            onkeydown="if(event.key==='Enter') handleActivate()">
                        <div class="toggle-password" onclick="togglePassword('act-pass')">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>
                <button onclick="handleActivate()" class="btn btn-primary">Activar mi Cuenta</button>
                <button onclick="showView('login')" class="btn btn-link">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container" class="hidden">

        <!-- Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="user-info" id="user-info-container">
                    <div class="user-avatar" id="avatar-display">?</div>
                    <div>
                        <div class="font-bold" id="my-name-display" style="font-size: 14px;">Usuario</div>
                        <div class="status-indicator">
                            <span class="dot"></span> ONLINE
                        </div>
                    </div>

                    <!-- Professional Hover Card -->
                    <div class="profile-card">
                        <h3>Mi Perfil</h3>
                        <div class="profile-detail">
                            <label>Nombre Completo</label>
                            <span id="card-name">-</span>
                        </div>
                        <div class="profile-detail">
                            <label>Oficina / Servicio</label>
                            <span id="card-office">-</span>
                        </div>
                        <div class="profile-detail">
                            <label>Teléfono WhatsApp</label>
                            <span id="card-phone">-</span>
                        </div>
                        <div class="profile-detail">
                            <label>Dirección IP</label>
                            <span id="card-ip">-</span>
                        </div>
                    </div>
                </div>
                <button onclick="logout()" class="input-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </button>
            </header>

            <div class="search-box">
                <input type="text" id="search-users" onkeyup="updateUserListUI()"
                    placeholder="Buscar personas u oficinas..." class="search-input">
            </div>

            <ul id="user-list"></ul>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-pattern"></div>

            <!-- Header -->
            <header class="chat-header">
                <div>
                    <h2 id="chat-title" style="color: #064e3b; font-size: 16px;">SALA GENERAL</h2>
                    <p id="typing-indicator" style="font-size: 10px; color: #059669; font-style: italic; opacity: 0;">
                        Escribiendo...</p>
                </div>
                <div id="my-username-display"
                    style="font-size: 10px; font-weight: 800; color: #999; letter-spacing: 1px;">SALA GLOBAL</div>
            </header>

            <!-- Messages Container -->
            <div id="messages"></div>

            <!-- Chat Input -->
            <footer class="chat-input-area">
                <form id="chat-form" onsubmit="sendMessage(event)" class="input-form">
                    <button type="button" onclick="document.getElementById('image-input').click()" class="input-btn">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                    </button>
                    <input type="file" id="image-input" class="hidden" accept="image/*"
                        onchange="handleImageSelect(this)">
                    <input type="text" id="msg-input" class="msg-input-field" placeholder="Escribe un mensaje aquí..."
                        autocomplete="off">
                    <button type="submit" class="send-btn">ENVIAR</button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast">
        <span id="toast-msg">Notificación</span>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="hidden" onclick="this.classList.add('hidden')">
        <img id="image-modal-img" src="" alt="Vista previa">
    </div>

    <script>
        const socket = io();
        let myUsername = '', myId = '', activeChat = 'general', iAmSupervisor = false;
        let chats = { 'general': { name: 'Sala General', messages: [], unread: 0 } }, lastUsers = [];
        const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3'); // Sound for messages

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');

        function togglePassword(id) {
            const input = document.getElementById(id);
            if (input.type === 'password') input.type = 'text';
            else input.type = 'password';
        }

        function showView(v) {
            document.querySelectorAll('#auth-box > div').forEach(d => d.id.startsWith('view-') ? d.classList.add('hidden') : null);
            document.getElementById('view-' + v).classList.remove('hidden');
        }

        async function handleLogin() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value.trim();
            if (!username || !password) return alert('Campos vacíos');
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    socket.emit('join', { username: username.toLowerCase() });
                    showToast('⌛ Verificando identidad...');
                } else alert(data.error);
            } catch (e) { alert('Error de conexión'); }
        }

        async function handleRegister() {
            const payload = {
                username: document.getElementById('reg-user').value.trim(),
                fullName: document.getElementById('reg-name').value.trim(),
                phone: document.getElementById('reg-phone').value.trim(),
                office: document.getElementById('reg-office').value.trim()
            };
            if (!payload.username || !payload.phone) return alert('Faltan datos');
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert('Solicitud enviada. El administrador te enviará un código.');
                    showView('activate');
                    document.getElementById('act-user').value = payload.username;
                } else alert(data.error);
            } catch (e) { alert('Error al registrar'); }
        }

        async function handleActivate() {
            const payload = {
                username: document.getElementById('act-user').value.trim(),
                code: document.getElementById('act-code').value.trim(),
                password: document.getElementById('act-pass').value.trim()
            };
            try {
                const res = await fetch('/api/auth/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert('¡Cuenta activada! Inicia sesión ahora.');
                    showView('login');
                } else alert(data.error);
            } catch (e) { alert('Error al activar'); }
        }

        socket.on('connect', () => {
            if (myUsername) {
                console.log('Reconectando identidad...');
                socket.emit('join', { username: myUsername.toLowerCase() });
            }
        });

        socket.on('login_error', (msg) => {
            alert(msg);
            location.reload();
        });

        socket.on('login_success', (data) => {
            myUsername = String(data.username).toLowerCase();
            const myFullName = data.name;
            iAmSupervisor = data.isSupervisor;

            // UI Updates
            document.getElementById('my-name-display').textContent = myFullName;
            document.getElementById('my-username-display').textContent = 'PERFIL: ' + myFullName.toUpperCase();
            document.getElementById('avatar-display').textContent = myFullName.charAt(0).toUpperCase();

            // Populate High-End Profile Card
            document.getElementById('card-name').textContent = myFullName;
            document.getElementById('card-office').textContent = data.group || 'General';
            document.getElementById('card-phone').textContent = data.phone || 'No registrado';
            document.getElementById('card-ip').textContent = data.ip || 'Local';

            loginScreen.style.opacity = '0';
            setTimeout(() => {
                loginScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
            }, 400);
            // Welcome toast removed as per user request
            // showToast('¡Bienvenido, ' + myFullName + '!');
        });

        socket.on('user_list', (users) => {
            lastUsers = users;
            updateUserListUI();
        });

        function updateUserListUI() {
            const list = document.getElementById('user-list');
            const search = document.getElementById('search-users').value.toLowerCase();
            list.innerHTML = '';

            // Sala General
            if ("sala general".includes(search)) {
                const gen = document.createElement('li');
                const unread = (chats['general'] && chats['general'].unread) || 0;
                gen.className = `user-item ${activeChat === 'general' ? 'active' : ''}`;
                gen.onclick = () => selectChat('general', 'Sala General');
                gen.innerHTML = `
                    <div class="room-icon">#</div>
                    <div class="user-details">
                        <h4>SALA GENERAL</h4>
                        <p>Chat para todos los servicios</p>
                    </div>
                    ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
                `;
                list.appendChild(gen);
            }

            lastUsers.forEach(u => {
                const me = String(myUsername || "").toLowerCase();
                const other = String(u.username || "").toLowerCase();
                if (other === me) return;

                const searchStr = search.toLowerCase();
                const nameMatch = u.name.toLowerCase().includes(searchStr);
                const officeMatch = (u.office && u.office.toLowerCase().includes(searchStr));
                const phoneMatch = (u.phone && u.phone.toString().includes(searchStr));
                const ipMatch = (u.ip && u.ip.includes(searchStr));

                if (nameMatch || officeMatch || phoneMatch || ipMatch) {
                    const li = document.createElement('li');
                    const uKey = String(u.username).toLowerCase();
                    const unread = (chats[uKey] && chats[uKey].unread) || 0;

                    li.className = `user-item ${String(activeChat).toLowerCase() === uKey ? 'active' : ''}`;
                    li.onclick = () => selectChat(uKey, u.name);
                    li.innerHTML = `
                        <div class="user-avatar">${u.name.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <h4>${u.name}</h4>
                            <p>${u.office || 'Oficina General'}</p>
                        </div>
                        ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
                    `;
                    list.appendChild(li);
                }
            });
        }

        function selectChat(id, name) {
            activeChat = String(id).toLowerCase();
            const pKey = activeChat;

            if (!chats[pKey]) chats[pKey] = { name, messages: [], unread: 0 };

            // Clear unread
            chats[pKey].unread = 0;

            document.getElementById('chat-title').textContent = pKey === 'general' ? 'SALA GENERAL' : `CHAT CON: ${name.toUpperCase()}`;
            renderMessages(chats[pKey].messages);
            updateUserListUI();

            // Mobile toggle
            if (window.innerWidth < 768) document.body.classList.add('app-mobile-chat');
        }

        function renderMessages(msgs) {
            messagesDiv.innerHTML = '';
            msgs.forEach(m => addMsgToUI(m));
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addMsgToUI(msg) {
            const me = String(myUsername || "").toLowerCase();
            const sender = String(msg.username || "").toLowerCase();
            const isMe = (sender === me);
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${isMe ? 'me' : 'them'}`;

            let html = '';
            if (msg.image) html += `<img src="${msg.image}" class="msg-image" onclick="openImageModal(this.src)">`;
            html += `<div>${msg.text}</div>`;
            const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            wrapper.innerHTML = `
                <div class="msg-bubble" id="msg-${msg.id}">
                    <div class="msg-options-tg" onclick="toggleMsgMenu('${msg.id}')">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>
                    </div>
                    <div class="msg-menu" id="menu-${msg.id}">
                        <button onclick="forwardMessage('${msg.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l5 5-5 5"></path><path d="M4 4v7a4 4 0 004 4h12"></path></svg>
                            Reenviar
                        </button>
                        ${isMe ? `
                        <button class="del-btn" onclick="deleteMessage('${msg.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
                            Eliminar
                        </button>` : ''}
                    </div>
                    ${!isMe && String(activeChat).toLowerCase() === 'general' ? `<div class="sender-name">${msg.sender}</div>` : ''}
                    ${html}
                    <div class="msg-time">${time} ${isMe ? '✓✓' : ''}</div>
                </div>
            `;
            messagesDiv.appendChild(wrapper);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage(e) {
            e.preventDefault();
            const text = msgInput.value.trim();

            // 1. Check Forwarding
            if (window.pendingForward) {
                const msg = window.pendingForward;
                const payload = { text: text || msg.text, image: msg.image };
                if (activeChat === 'general') {
                    socket.emit('chat_message', payload);
                } else {
                    socket.emit('private_message', { targetId: activeChat, ...payload });
                }
                window.pendingForward = null;
                msgInput.value = '';
                showToast('Mensaje reenviado');
                return;
            }

            // 2. Normal Message
            if (!text) return;
            if (activeChat === 'general') {
                socket.emit('chat_message', text);
            } else {
                socket.emit('private_message', { targetId: activeChat, text });
            }
            msgInput.value = '';
        }

        socket.on('message', (msg) => {
            if (!chats['general'].messages.find(m => m.id === msg.id)) {
                chats['general'].messages.push(msg);
                if (String(activeChat).toLowerCase() === 'general') {
                    addMsgToUI(msg);
                } else {
                    chats['general'].unread = (chats['general'].unread || 0) + 1;
                    msgSound.play().catch(e => { console.error('Error playing sound:', e); });
                    updateUserListUI();
                }
            }
        });

        socket.on('private_message', (msg) => {
            const me = String(myUsername).toLowerCase();
            const sender = String(msg.username).toLowerCase();
            const target = String(msg.targetUsername).toLowerCase();

            const isMeSender = (sender === me);
            const partnerUsername = isMeSender ? target : sender;
            const pKey = partnerUsername;

            if (!chats[pKey]) {
                const partnerName = isMeSender ? msg.targetName : msg.sender;
                chats[pKey] = { name: partnerName, messages: [], unread: 0 };
            }

            if (!chats[pKey].messages.find(m => m.id === msg.id)) {
                chats[pKey].messages.push(msg);
                if (String(activeChat).toLowerCase() === pKey) {
                    addMsgToUI(msg);
                } else {
                    chats[pKey].unread = (chats[pKey].unread || 0) + 1;
                    msgSound.play().catch(e => { console.error('Error playing sound:', e); });
                    updateUserListUI();
                }
            }
        });

        socket.on('history', (h) => {
            const me = String(myUsername).toLowerCase();
            h.forEach(msg => {
                if (!msg.isPrivate) {
                    if (!chats['general'].messages.find(m => m.id === msg.id)) chats['general'].messages.push(msg);
                } else {
                    const sender = String(msg.username).toLowerCase();
                    const target = String(msg.targetUsername).toLowerCase();
                    const partner = (sender === me) ? target : sender;

                    if (partner) {
                        if (!chats[partner]) {
                            const partnerName = (sender === me) ? msg.targetName : msg.sender;
                            chats[partner] = { name: partnerName, messages: [] };
                        }
                        if (!chats[partner].messages.find(m => m.id === msg.id)) chats[partner].messages.push(msg);
                    }
                }
            });
            renderMessages(chats[activeChat].messages);
        });

        socket.on('message_deleted', (id) => {
            // Remove from memory
            Object.values(chats).forEach(c => {
                c.messages = c.messages.filter(m => m.id != id);
            });
            // UI remove
            const el = document.getElementById(`msg-${id}`);
            if (el) {
                el.parentElement.style.opacity = '0.3';
                el.innerHTML = '<div style="font-style:italic; color:#999; font-size:11px">🚫 Mensaje eliminado</div>';
            }
        });

        function toggleMsgMenu(id) {
            const menu = document.getElementById(`menu-${id}`);
            const all = document.querySelectorAll('.msg-menu');
            all.forEach(m => m !== menu ? m.classList.remove('show') : null);
            menu.classList.toggle('show');
        }

        function deleteMessage(id) {
            if (!confirm('¿Eliminar mensaje para todos?')) return;
            socket.emit('delete_message', id);
        }

        function forwardMessage(id) {
            let msg;
            Object.values(chats).forEach(c => {
                const found = c.messages.find(m => m.id == id);
                if (found) msg = found;
            });
            if (msg) {
                window.pendingForward = msg;
                msgInput.value = (msg.text === '📷 Imagen' || !msg.text) ? '' : msg.text;
                showToast('↩️ Reenviar: Selecciona un chat y pulsa ENVIAR');
                msgInput.focus();
            }
        }

        // Close menus on click outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.msg-options-tg')) {
                document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('show'));
            }
        });

        function handleImageSelect(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const payload = { text: '📷 Imagen', image: e.target.result };
                if (activeChat === 'general') {
                    socket.emit('chat_message', payload);
                } else {
                    socket.emit('private_message', { targetId: activeChat, ...payload });
                }
            };
            reader.readAsDataURL(file);
        }

        function openImageModal(s) { document.getElementById('image-modal-img').src = s; document.getElementById('image-modal').classList.remove('hidden'); }
        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = m;
            t.style.transform = 'translateX(0)';
            setTimeout(() => t.style.transform = 'translateX(150%)', 4000);
        }
        function logout() { location.reload(); }

        // Prevent enter submitting forms unless focused on input
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !msgInput.matches(':focus')) {
                // Handle auth enters
                if (document.activeElement.id.includes('login') || document.activeElement.id.includes('reg')) {
                    // already handled by onclick or inline
                }
            }
        });
    </script>
</body>

</html>
