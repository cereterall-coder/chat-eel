<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-ELL | Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=League+Gothic&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-logo {
            font-family: 'League Gothic', sans-serif;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
            <h2 class="text-4xl text-gray-800 mb-6 font-logo uppercase">Administración</h2>
            <input type="password" id="admin-key"
                class="w-full border-2 border-gray-100 p-3 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none transition"
                placeholder="Clave Maestra">
            <button onclick="authenticate()"
                class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">INGRESAR
                AL PANEL</button>
            <p id="auth-error" class="text-red-500 text-xs mt-3 hidden font-bold">⚠️ Clave incorrecta</p>
        </div>
    </div>

    <!-- MAIN NAV -->
    <div id="main-ui" class="hidden">
        <nav class="bg-white shadow-sm border-b">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-8">
                    <h1 class="text-3xl font-logo text-gray-800">Chat-ELL <span class="text-blue-600">MASTER</span></h1>
                    <div class="flex gap-2">
                        <button onclick="switchTab('users')" id="tab-users"
                            class="px-4 py-2 rounded-lg font-bold text-sm transition">👤 USUARIOS</button>
                        <button onclick="switchTab('audit')" id="tab-audit"
                            class="px-4 py-2 rounded-lg font-bold text-sm transition text-gray-500 hover:bg-gray-100">📋
                            AUDITORÍA</button>
                        <button onclick="switchTab('config')" id="tab-config"
                            class="px-4 py-2 rounded-lg font-bold text-sm transition text-gray-500 hover:bg-gray-100">🌐
                            RED</button>
                        <button onclick="switchTab('safety')" id="tab-safety"
                            class="px-4 py-2 rounded-lg font-bold text-sm transition text-gray-500 hover:bg-gray-100">🔐
                            SEGURIDAD</button>
                    </div>
                </div>
                <button onclick="location.reload()" class="text-gray-400 hover:text-red-500 transition">Salir</button>
            </div>
        </nav>

        <main class="container mx-auto p-6">

            <!-- SECTION: USERS -->
            <section id="view-users" class="space-y-6">
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Validación de Cuentas</h2>
                        <p class="text-sm text-gray-500">Solicitudes pendientes de aprobación vía WhatsApp</p>
                    </div>
                    <button onclick="fetchPending()"
                        class="text-blue-600 text-sm font-bold flex items-center gap-1 hover:underline">🔄
                        Actualizar</button>
                </div>
                <div id="pending-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards JS -->
                </div>
            </section>

            <!-- SECTION: AUDIT -->
            <section id="view-audit" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm flex gap-4 items-center mb-4">
                    <input type="text" id="filter-user" onkeyup="renderLogs()"
                        class="border p-2 rounded-lg flex-1 text-sm outline-none focus:border-blue-500"
                        placeholder="Filtrar usuario...">
                    <input type="text" id="filter-text" onkeyup="renderLogs()"
                        class="border p-2 rounded-lg flex-1 text-sm outline-none focus:border-blue-500"
                        placeholder="Buscar mensaje...">
                    <button onclick="fetchLogs()"
                        class="bg-gray-100 px-4 py-2 rounded-lg text-sm font-bold text-gray-600 hover:bg-gray-200">🔍
                        Buscar</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 border-b text-gray-400 uppercase text-[10px] font-bold">
                            <tr>
                                <th class="px-6 py-4">Fecha/Hora</th>
                                <th class="px-6 py-4">Remitente</th>
                                <th class="px-6 py-4 w-1/2">Mensaje</th>
                                <th class="px-6 py-4">Oficina</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body" class="divide-y"></tbody>
                    </table>
                </div>
            </section>

            <!-- SECTION: CONFIG -->
            <section id="view-config" class="hidden">
                <div class="bg-white p-6 rounded-xl shadow-sm border text-center py-20 text-gray-400">
                    <p>Módulo de configuración de grupos IP habilitado.</p>
                </div>
            </section>

            <!-- SECTION: SAFETY -->
            <section id="view-safety" class="hidden max-w-lg mx-auto bg-white p-8 rounded-2xl shadow-sm border">
                <h3 class="text-xl font-bold mb-6">Cambiar Password de Administrador</h3>
                <input type="password" id="new-key"
                    class="w-full border p-3 rounded-xl mb-3 outline-none focus:border-blue-500"
                    placeholder="Nueva Clave Maestra">
                <input type="password" id="new-key-conf"
                    class="w-full border p-3 rounded-xl mb-6 outline-none focus:border-blue-500"
                    placeholder="Repetir Clave">
                <button onclick="updateSafetyKey()"
                    class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-black transition">GUARDAR
                    CAMBIOS</button>
            </section>

        </main>
    </div>

    <script>
        let adminKey = '';
        let logsRaw = [];

        async function authenticate() {
            const key = document.getElementById('admin-key').value;
            const res = await fetch('/api/admin/pending', { headers: { 'x-admin-key': key } });
            if (res.ok) {
                adminKey = key;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                switchTab('users');
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function switchTab(tab) {
            ['users', 'audit', 'config', 'safety'].forEach(t => {
                document.getElementById('view-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('bg-blue-600', 'text-white');
                document.getElementById('tab-' + t).classList.add('text-gray-500', 'hover:bg-gray-100');
            });
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.remove('text-gray-500', 'hover:bg-gray-100');
            document.getElementById('tab-' + tab).classList.add('bg-blue-600', 'text-white');

            if (tab === 'users') fetchPending();
            if (tab === 'audit') fetchLogs();
        }

        async function fetchPending() {
            const res = await fetch('/api/admin/pending', { headers: { 'x-admin-key': adminKey } });
            const data = await res.json();
            const list = document.getElementById('pending-list');
            list.innerHTML = '';

            Object.entries(data).forEach(([username, u]) => {
                const div = document.createElement('div');
                div.className = "bg-white p-6 rounded-2xl border shadow-sm hover:shadow-md transition group";
                div.innerHTML = `
                    <div class="mb-4">
                        <span class="text-[10px] font-extrabold text-blue-500 uppercase tracking-tighter">${u.office || 'Oficina No Def.'}</span>
                        <h4 class="text-lg font-bold text-gray-800">${u.fullName}</h4>
                    </div>
                    <div class="text-xs text-gray-500 space-y-1 mb-6">
                        <p><b>Usuario:</b> ${username}</p>
                        <p><b>Teléfono:</b> ${u.phone}</p>
                        <p><b>IP PC:</b> ${u.ip}</p>
                    </div>
                    <button onclick="approveUser('${username}')" class="w-full bg-emerald-50 text-emerald-600 py-3 rounded-xl font-bold flex items-center justify-center gap-2 group-hover:bg-emerald-600 group-hover:text-white transition-all">
                        <span>Validar & Enviar WhatsApp</span>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        async function approveUser(username) {
            const res = await fetch('/api/admin/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            if (data.success) {
                window.open(data.waLink, '_blank');
                fetchPending();
            }
        }

        async function fetchLogs() {
            const res = await fetch('/api/audit', { headers: { 'x-admin-key': adminKey } });
            logsRaw = await res.json();
            renderLogs();
        }

        function renderLogs() {
            const userF = document.getElementById('filter-user').value.toLowerCase();
            const textF = document.getElementById('filter-text').value.toLowerCase();
            const body = document.getElementById('logs-body');
            body.innerHTML = '';

            logsRaw.filter(l =>
                (l.sender.toLowerCase().includes(userF)) &&
                (l.text.toLowerCase().includes(textF))
            ).reverse().forEach(l => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="px-6 py-4 text-xs text-gray-400">${new Date(l.timestamp).toLocaleString()}</td>
                    <td class="px-6 py-4 font-bold text-gray-700">${l.sender}</td>
                    <td class="px-6 py-4 text-gray-600">${l.text}</td>
                    <td class="px-6 py-4"><span class="text-[10px] bg-gray-100 px-2 py-1 rounded-full font-bold text-gray-500">${l.office || 'Global'}</span></td>
                `;
                body.appendChild(tr);
            });
        }
    </script>
</body>

</html>
